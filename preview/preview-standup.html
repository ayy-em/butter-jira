<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Standup setup — preview</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/kanban.css">
  <link rel="stylesheet" href="../css/standup.css">
  <style>
    html, body { overflow: hidden; }
    /* Production gives this a definite height (absolutely positioned between
       the nav and the footer). Static with no height meant `height: 100%` on
       the stage resolved against nothing, so the running screen rendered at
       content height here and full height in the app — the harness hid the one
       thing it exists to show. */
    #view-container { position: static; height: 100vh; overflow: auto; }
  </style>
</head>
<body>
  <div id="view-container"></div>
  <script type="module" src="preview-standup.js"></script>
</body>
</html>
