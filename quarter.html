<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="assets/favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/favicon-128.ico" sizes="128x128">
  <title>Quarterly overview — butter_jira</title>
  <!-- Deliberately not css/app.css: its app-shell rules clip a print job. The
       recap's stylesheet is the base; quarter.css adds only the charts. -->
  <link rel="stylesheet" href="css/recap.css">
  <link rel="stylesheet" href="css/quarter.css">
</head>
<body class="recap-page">
  <div class="recap-toolbar" id="recap-toolbar">
    <!-- Starts disabled, for the same reason the recap's does: this page fetches
         before it can render. -->
    <button class="recap-print-btn" id="recap-print" disabled>Preparing…</button>
    <label class="quarter-picker">
      <span>Quarter</span>
      <select id="quarter-select"></select>
    </label>
    <span class="recap-toolbar-note" id="recap-toolbar-note">
      Building the overview…
    </span>
  </div>
  <div class="recap-sheet">
    <div class="recap" id="recap-root"></div>
  </div>
  <script type="module" src="js/quarter-page.js"></script>
</body>
</html>
