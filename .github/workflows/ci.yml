# Every suite, on every push to main and every pull request (M19).
#
# There is nothing to install: the suites are plain Node with no dependencies,
# no network and no browser, which is why they can run here at all. Adding a
# lockfile to get an `npm ci` step would make this the project's first
# dependency, and the release workflow makes the same choice for the same
# reason.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Suites and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test suites
        run: |
          for f in scripts/test-*.mjs; do
            echo "── $f"
            node "$f" || exit 1
          done

      - name: Build all three targets
        run: node scripts/build.mjs

      # build.mjs regenerates the root manifest.json, which is committed so the
      # repo loads unpacked with no build step. A diff here means somebody
      # edited the generated file instead of manifest.base.json — which works
      # locally, and is precisely why it needs catching somewhere else.
      - name: No generated-file drift
        run: |
          if ! git diff --exit-code -- manifest.json; then
            echo "::error file=manifest.json::manifest.json changed after a build. Edit manifest.base.json or manifest.<target>.json and commit the regenerated file."
            exit 1
          fi
